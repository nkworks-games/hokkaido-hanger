<script>
(() => {

// ================= 基本設定（数値はここで調整） =================

const SUB = 10;                 // 物理の細かさ（1フレームを何回に分けて計算するか）

const BAR_R = 3.7;              // 棒の太さ（半径）。噴火湾の入口は 幅7.5 しかないので 3.75 以上は入らない。細いほど やさしい（前の版は 3）

const HK_KM = [240.4,1.5,244.5,3.9,228.4,10.6,221.1,25.6,202.8,25.1,189.4,30.1,188.2,34.6,192.0,35.6,184.4,40.6,178.6,39.5,179.4,45.5,167.5,45.7,161.9,39.1,156.7,46.6,160.8,51.7,157.3,52.8,145.9,50.0,134.8,51.3,123.4,44.2,112.1,47.0,88.1,61.6,62.8,88.4,44.4,119.9,43.5,141.0,35.6,163.3,12.9,143.7,-27.6,125.3,-51.3,104.3,-59.7,103.2,-79.6,88.8,-94.1,87.1,-111.1,92.7,-138.5,111.8,-147.8,122.1,-151.3,118.9,-146.9,117.6,-151.9,114.8,-167.3,92.7,-186.3,91.0,-200.6,107.3,-203.2,126.6,-182.5,143.7,-169.1,140.5,-147.8,164.8,-137.3,169.5,-129.7,177.6,-145.2,187.3,-160.1,180.7,-169.4,183.6,-167.9,176.3,-173.5,174.6,-177.8,184.7,-190.1,190.7,-191.8,207.4,-204.7,212.8,-209.9,221.8,-223.6,217.1,-228.6,201.7,-220.1,177.4,-216.3,174.9,-215.2,157.3,-224.5,143.7,-232.7,139.9,-244.1,127.9,-245.8,120.8,-240.0,108.2,-239.4,85.8,-233.6,80.1,-223.6,79.2,-212.0,65.5,-204.1,71.3,-195.1,54.5,-184.6,44.7,-187.5,35.2,-200.3,16.6,-197.7,8.4,-191.6,8.0,-188.6,3.0,-162.4,22.6,-144.9,18.9,-144.0,24.9,-132.1,28.8,-121.3,22.4,-111.6,9.1,-110.2,-0.8,-116.6,-13.7,-114.3,-19.9,-118.6,-34.7,-113.4,-44.8,-103.2,-48.9,-93.8,-59.6,-92.7,-97.3,-85.4,-113.6,-81.6,-132.9,-84.8,-164.7,-99.4,-200.5,-91.8,-227.5,-89.8,-222.2,-79.3,-224.5,-69.3,-235.3,-21.2,-179.5,-13.6,-164.5,14.7,-131.6,44.7,-108.9,48.2,-102.3,79.1,-87.5,71.2,-86.8,75.3,-79.1,92.2,-77.2,97.2,-81.3,106.8,-81.0,111.2,-78.0,105.6,-70.1,109.7,-68.8,117.0,-79.9,119.6,-70.7,127.8,-61.7,161.1,-57.9,194.6,-89.4,206.0,-105.0,208.3,-94.1,189.9,-61.3,184.1,-41.6,196.1,-21.0,203.4,3.7,210.1,10.5,200.1,6.0,199.6,9.3,206.6,14.9,220.3,18.9,218.5,14.4,225.5,7.1,231.9,2.2];
const BAY0 = 33, BAY1 = 45, ROOF = 42; // 内浦湾（噴火湾）：地球岬(33) → 長万部 → 恵山岬(45)。ROOF＝ぶら下がる時に棒が当たる所
const HK = (() => {
  const n = HK_KM.length / 2; let mn = 1e9, mx = -1e9;
  for (let i = 0; i < n; i++) { mn = Math.min(mn, HK_KM[2 * i]); mx = Math.max(mx, HK_KM[2 * i]); }
  const sc = HK_W / (mx - mn), X = new Float64Array(n), Y = new Float64Array(n);
  for (let i = 0; i < n; i++) { X[i] = HK_KM[2 * i] * sc; Y[i] = HK_KM[2 * i + 1] * sc; }
  let A = 0, cx = 0, cy = 0, Io = 0;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n, c = X[i] * Y[j] - X[j] * Y[i]; A += c; cx += (X[i] + X[j]) * c; cy += (Y[i] + Y[j]) * c; Io += c * (X[i] * X[i] + X[i] * X[j] + X[j] * X[j] + Y[i] * Y[i] + Y[i] * Y[j] + Y[j] * Y[j]); }
  A /= 2; cx /= 6 * A; cy /= 6 * A; Io /= 12;
  const I = Math.abs((Io - A * (cx * cx + cy * cy)) / A); // 重さ1あたりの回りにくさ
  for (let i = 0; i < n; i++) { X[i] -= cx; Y[i] -= cy; }
  const EX = new Float64Array(n), EY = new Float64Array(n), IL = new Float64Array(n); let maxY = -1e9, rad = 0;
  for (let i = 0; i < n; i++) { const j = (i + 1) % n; EX[i] = X[j] - X[i]; EY[i] = Y[j] - Y[i]; IL[i] = 1 / (EX[i] * EX[i] + EY[i] * EY[i]); maxY = Math.max(maxY, Y[i]); rad = Math.max(rad, Math.hypot(X[i], Y[i])); }
  const path = new Path2D(); for (let i = 0; i < n; i++) i ? path.lineTo(X[i], Y[i]) : path.moveTo(X[i], Y[i]); path.closePath();
  const bay = new Path2D(); for (let i = BAY0; i <= BAY1; i++) i === BAY0 ? bay.moveTo(X[i], Y[i]) : bay.lineTo(X[i], Y[i]);
  return { n, X, Y, EX, EY, IL, I, path, bay, maxY, rad };
})();
const ROOF_N = { x: -0.406, y: -0.914 }; // 屋根から湾の内側へ向かう向き
const seatFor = r => ({ x: HK.X[ROOF] + ROOF_N.x * (r + 0.8), y: HK.Y[ROOF] + ROOF_N.y * (r + 0.8) }); // 棒が座る点
const EQ_ANG = (() => { const s = seatFor(6); return Math.PI / 2 - Math.atan2(-s.y, -s.x); })(); // ぶら下がった時の角度
function pip(x, y) { let c = false; for (let i = 0, j = HK.n - 1; i < HK.n; j = i++) { if ((HK.Y[i] > y) !== (HK.Y[j] > y) && x < (HK.X[j] - HK.X[i]) * (y - HK.Y[i]) / (HK.Y[j] - HK.Y[i]) + HK.X[i]) c = !c; } return c; }

// ================= ステージ（凍った鉄棒 1本だけ。x＝横の位置、h＝なげるラインからの高さ、r＝棒の太さ） =================
const STAGE = { name: '凍った鉄棒', x: 0.45, h: BAR_H, r: BAR_R, mat: 'ice' };

// ================= 画面サイズ =================
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let H = 700, S = 1, DPR = 1, OX = 0, OY = 0;
const L = {};
function layout() {
  L.GY = H - 30;            // 地面
  L.throwY = H - 225;       // なげるライン（ここより上に指が出たら投げる）
  L.reset = { x: W - 24, y: 82 };
  L.mute = { x: W - 64, y: 82 };
}
function resize() {
  const sa = document.getElementById('sa'), cs = getComputedStyle(sa);
  const st = parseFloat(cs.paddingTop) || 0, sb = parseFloat(cs.paddingBottom) || 0;
  const vw = window.innerWidth, vh = window.innerHeight - st - sb;
  S = Math.min(vw / W, vh / 600); H = Math.min(vh / S, 820);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const cw = W * S, ch = H * S; OX = (vw - cw) / 2; OY = st + (vh - ch) / 2;
  Object.assign(cv.style, { width: cw + 'px', height: ch + 'px', left: OX + 'px', top: OY + 'px' });
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  layout();
  if (G.state === 'play') { placeBar(); if (B.y > L.GY) resetBody(); } // 画面の大きさが変わった時
}
window.addEventListener('resize', resize);

// ================= 保存（音のオンオフ・自己ベスト） =================
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

// ================= サウンド =================
let AC = null, NOISE = null, OUT = null, muted = store.get('hh_mute', false);
function audioInit() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const b = AC.createBuffer(1, AC.sampleRate * 1.2, AC.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      NOISE = b; OUT = AC.createGain(); OUT.gain.value = 0.9; OUT.connect(AC.destination);
      const s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0);
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { }
}
function tone(f1, f2, dur, type = 'sine', vol = 0.15, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, type = 'lowpass', freq = 1200, delay = 0) {
  if (!AC || muted || !NOISE) return;
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(OUT); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
const C5 = 523.25, semi = n => C5 * Math.pow(2, n / 12);
const SFX = {
  grab() { tone(420, 760, 0.09, 'sine', 0.18); },
  throw(v) { const k = Math.min(1, v / 1600); noise(0.25 + k * 0.15, 0.08 + k * 0.12, 'bandpass', 700 + k * 900); tone(300, 900 + k * 600, 0.18, 'sine', 0.05); },
  hitBar(v) { const k = Math.min(1, v / 900); tone(1500, 1250, 0.18, 'triangle', 0.07 + k * 0.08); tone(2300, 2100, 0.12, 'sine', 0.04); noise(0.04, 0.08, 'highpass', 4000); }, // 凍った鉄棒：カーン
  thud(v) { const k = Math.min(1, v / 900); tone(130, 60, 0.18, 'sine', 0.18 + k * 0.2); noise(0.12, 0.08 + k * 0.12, 'lowpass', 500); },
  snap() { noise(0.05, 0.3, 'highpass', 3500); tone(1900, 1900, 0.05, 'square', 0.06); [0, 4, 7, 12].forEach((n, i) => tone(semi(n + 7), semi(n + 7), 0.16, 'triangle', 0.1, 0.06 + i * 0.07)); },
  clear(hio) { const seq = hio ? [0, 4, 7, 12, 16, 19, 24, 28] : [0, 4, 7, 12]; seq.forEach((n, i) => tone(semi(n), semi(n), 0.22, 'square', 0.05, i * 0.08)); tone(semi(seq[seq.length - 1]), semi(seq[seq.length - 1]), 0.6, 'triangle', 0.08, seq.length * 0.08); },
  oshii() { tone(660, 520, 0.12, 'triangle', 0.08); tone(520, 392, 0.2, 'triangle', 0.08, 0.12); },
  pop() { tone(880, 1320, 0.08, 'sine', 0.1); },
  slip() { tone(1100, 320, 0.28, 'sine', 0.1); noise(0.12, 0.05, 'highpass', 5000); },
  tick(k) { tone(k ? 1320 : 990, k ? 1320 : 990, 0.06, 'triangle', 0.08); },
  click() { tone(900, 900, 0.04, 'square', 0.04); },
  roll() { tone(1200, 1200, 0.03, 'square', 0.03); },
  fanfare() { [0, 4, 7, 12, 7, 12, 16, 19, 24].forEach((n, i) => tone(semi(n), semi(n), 0.2, 'square', 0.05, i * 0.1)); noise(0.6, 0.2, 'lowpass', 180, 0.9); },
};
function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { } }

// ================= ゲームの状態 =================
const G = { state: 'title', t: 0, st: 0, fx: [], shake: 0, flash: 0, throws: 0, time: 0 }; window.__nkwG = G;
const B = { x: 180, y: 400, a: 0, vx: 0, vy: 0, w: 0 }; // 北海道（剛体）
const BAR = { x: 180, y: 200, r: BAR_R, vx: 0, vy: 0, bx: 180, by: 200 };
const since = () => G.t - G.ts;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = s => { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function setState(s) { G.state = s; G.ts = G.t; }
function stg() { return STAGE; }

function startGame() { clearRun(); G.throws = 0; G.time = 0; startPlay(); }
// 続きから遊べるように、投げた回数と時間を保存する（ページを閉じても、掛かるまで数え続ける）
function saveRun() { store.set('hh2_run', { throws: G.throws, time: Math.round(G.time) }); }
function loadRun() { const r = store.get('hh2_run', null); return r && r.throws > 0 ? r : null; }
function clearRun() { try { localStorage.removeItem('hh2_run'); } catch (e) { } }
function continueGame(r) { G.throws = r.throws; G.time = r.time || 0; startPlay(); say(`つづきから　ここまで ${G.throws}投`, 1.8); }
function startPlay() {
  setState('play');
  Object.assign(G, { st: 0, miss: G.throws, hold: false, flying: false, entered: false, near: 1e9, inBay: false, hookT: 0, hooked: false, hookedT: 0, clrS: false, ground: false, hitBar: 0, impact: 0, stuckT: 0, said: '', saidT: -9, fx: [], face: 'normal', faceT: 0 });
  BAR.r = STAGE.r; placeBar();
  G.seat = seatFor(STAGE.r);
  resetBody();
  if (G.throws === 0) say('噴火湾を 凍った鉄棒に 引っ掛けろ!\n上がる時は 棒をすり抜けるよ', 4);
}
function startStage() { G.throws = 0; G.time = 0; startPlay(); } // テスト用（保存には触らない）
function placeBar() { BAR.bx = STAGE.x * W; BAR.by = L.throwY - Math.min(STAGE.h, L.throwY - 140); BAR.x = BAR.bx; BAR.y = BAR.by; }
function resetBody() {
  Object.assign(B, { a: 0, vx: 0, vy: 0, w: 0 }); B.x = W / 2; B.y = L.GY - HK.maxY - 2;
  G.hold = false; G.flying = false; G.ghost = false; G.inBay = false; G.hookT = 0; G.stuckT = 0; G.upT = 0;
}
function updateBar() { BAR.x = BAR.bx; BAR.y = BAR.by; } // 棒は動かない（止まっている棒に掛けるだけ。なのに…）
function say(s, dur = 1.4) { G.said = s; G.saidT = G.t; G.saidDur = dur; }
function setFace(f, dur = 0.8) { G.face = f; G.faceT = G.t + dur; }

// ================= 物理 =================
function physStep(h) {
  G.st += h; updateBar();
  B.vy += GRAV * h;
  B.w *= 1 - (G.hold ? 1.4 : G.hooked ? 4 : SPIN_AIR) * h; // 掛かった後は 揺れをすぐ止める
  if (G.hold) grabSolve(h);
  const sp = Math.hypot(B.vx, B.vy); if (sp > MAXV) { B.vx *= MAXV / sp; B.vy *= MAXV / sp; }
  B.w = clamp(B.w, -MAXW, MAXW);
  B.x += B.vx * h; B.y += B.vy * h; B.a += B.w * h;
  if (G.ghost && B.vy >= 0 && !barOverlap()) G.ghost = false; // 投げて上がっている間は棒をすり抜ける。落ち始めて棒から離れたら当たるようになる
  if (!G.ghost) collideBar();
  collideBounds();
}

  text('凍った鉄棒に 噴火湾を 引っ掛けろ!', W / 2, H * 0.14 + 92, 15, '#2a3a4a', { stroke: 'rgba(255,255,255,0.85)', sw: 5 });
  text('※ 鬼畜：1回 掛けられたら クリア（つるつる注意）', W / 2, H * 0.14 + 116, 11, '#e5484d', { stroke: 'rgba(255,255,255,0.9)', sw: 4 });
  const pul = 1 + Math.sin(G.t * 5) * 0.03, bigBtn = (b, label, sub) => {
    ctx.save(); ctx.translate(W / 2, b.y + b.h / 2); ctx.scale(pul, pul); ctx.fillStyle = '#ff7a00'; ctx.shadowColor = 'rgba(160,70,0,0.5)'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 5; rrect(-b.w / 2, -b.h / 2, b.w, b.h, 30); ctx.fill(); ctx.restore();

  if (tb.run) {
    bigBtn(tb.cont, 'つづきから', `ここまで ${tb.run.throws}投・${fmtTime(tb.run.time || 0)}`);

    if (tb.giveup) { const g = tb.giveup; ctx.fillStyle = '#111'; rrect(g.x, g.y, g.w, g.h, 15); ctx.fill(); text('「まだ掛からない…」を Xでシェア', W / 2, g.y + g.h / 2 + 1, 12, '#fff'); lastY = g.y + g.h; }
  } else {
    bigBtn(tb.start, 'スタート');
    text('つまんで 上にスワイプして 投げる', W / 2, tb.start.y - 22, 13, '#2a3a4a', { w: 500, stroke: 'rgba(255,255,255,0.8)', sw: 4 });
    lastY = tb.start.y + tb.start.h;

function drawResult() {

    text(rk[1], W / 2, y0 + 135, 11.5, '#5a7a90', { w: 500 });

  if (t > 1.5 && R.newBest) text('自己ベスト更新!!', W / 2, y0 - 56, 18, '#ff5d73', { stroke: '#fff', sw: 5, sc: 1 + Math.max(0, 0.2 - (t - 1.5)) * 2, rot: -0.05 });
  else if (t > 1.5 && !R.first) text(`自己ベスト ${R.best}投目`, W / 2, y0 - 56, 12, '#2a5f8f', { w: 500, stroke: 'rgba(255,255,255,0.8)', sw: 4 });
  if (t > 0.8) {

    ctx.fillStyle = '#fff'; rrect(b.retry.x, b.retry.y, b.retry.w, b.retry.h, 25); ctx.fill(); text('もう一度', b.retry.x + b.retry.w / 2, b.retry.y + b.retry.h / 2 + 1, 18, '#2a3a4a');

    text('タイトルへ', W / 2, b.menu.y + 14, 13, '#2a5f8f', { w: 500 });
  }
}

function render() {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  if (G.shake > 0) { const a = G.shake * 12; ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a); }
  if (G.state === 'title') drawTitle();
  else if (G.state === 'result') drawResult();
  else drawPlay();
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  if (G.flash > 0) { ctx.save(); ctx.globalAlpha = G.flash * 0.5; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.restore(); }
}

resize();
